<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ActiveTab</title>
    <style>
      body { width: 300px; margin: 0; padding: 16px; color: #182026; font: 14px system-ui, sans-serif; }
      h1 { margin: 0 0 10px; font-size: 18px; }
      p { margin: 8px 0; overflow-wrap: anywhere; color: #46515a; white-space: pre-wrap; }
      button { width: 100%; margin-top: 12px; padding: 9px 12px; border: 0; border-radius: 6px; background: #156fca; color: white; font: inherit; cursor: pointer; }
      button[hidden] { display: none; }
      #status { min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>ActiveTab</h1>
    <p id="page">Checking current tab…</p>
    <p id="status" role="status">No tab is attached.</p>
    <button id="attach">Attach to this tab</button>
    <button id="detach" hidden>Detach tab</button>
    <script src="popup.js"></script>
  </body>
</html>
